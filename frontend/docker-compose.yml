version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-tts-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8081/api
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
