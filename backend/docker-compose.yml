services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english-tts-backend
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: english-tts-db
    environment:
      POSTGRES_USER: ${DB_USER:-english_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-english_password}
      POSTGRES_DB: ${DB_NAME:-english_conversation}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-english_user} -d ${DB_NAME:-english_conversation}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
